  font-size:12px; color:rgba(255,255,255,0.3); pointer-events:none; }
.sign .h{ font-family:system-ui,sans-serif; font-size:11px; line-height:1; display:block;
  transform:translateY(-1px); color:var(--acc-2); }

.load{ position:absolute; inset:0; display:grid; place-items:center; z-index:50; background:#050403 }
.load i{ width:30px; height:30px; border:3px solid rgba(255,255,255,0.16);
  border-top-color:var(--acc); animation:spin .8s linear infinite }
@keyframes spin{ to{ transform:rotate(360deg) } }

.modal{ position:fixed; inset:0; z-index:60; display:none; background:rgba(3,3,4,0.96);
  padding:20px 16px; overflow-y:auto; }
.modal.on{ display:grid; place-items:center }
.modal-in{ width:100%; max-width:min(94vw,560px); display:grid; gap:20px; justify-items:center }
.holder{ width:100%; display:grid; place-items:center }
.holder canvas{ display:block; width:auto; height:auto; max-width:100%;
  max-height:min(calc(100vh - 232px),820px);
  box-shadow:0 24px 70px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08); }
.swatches{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; pointer-events:auto }
.swatches button{ width:42px; height:42px; border:2px solid rgba(255,255,255,0.18); padding:0;
  transition:transform .14s var(--ease),border-color .14s var(--ease) }
.swatches button:hover{ transform:translateY(-3px); border-color:rgba(255,255,255,0.55) }
.swatches button[aria-pressed="true"]{ border-color:#fff; transform:translateY(-3px) }
.macts{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap }
.macts .b{ min-width:132px; pointer-events:auto }

@media (max-height:740px){
  .card{ padding:72px 20px 40px }
  .big{ font-size:38px } .big.n7{ font-size:28px } .big.n9{ font-size:24px }
  .big.sm{ font-size:26px } .big.xs{ font-size:18px } .unit{ font-size:17px }
  .lead,.tail,.ctx div,.fun,.exp,.rh span,.rh b,.rl,.rp,.facts div,.sl{ font-size:14px }
  .rn{ font-size:18px } .sn{ font-size:24px }
  .slot{ width:52px; height:52px } .slot img{ width:32px; height:32px }
  .head{ width:52px; height:52px } .head.big{ width:68px; height:68px }
}
html.embed .gate{ padding:20px 16px; }
html.embed .gate-logo{ width:88px; height:88px; margin-bottom:16px; }
html.embed .gate h1{ font-size:23px; }
html.embed .gate p{ margin-bottom:22px; }
html.embed .gate input,html.embed .gate form button{ height:50px; }
html.embed .gate .foot{ margin-top:24px; }
html.embed .gate-dc,html.embed .dc-line{ display:none; }
html.embed .sign{ pointer-events:auto; }
html.embed .sign a{ display:flex; align-items:center; gap:5px; color:inherit; text-decoration:none; }
html.embed .sign a:hover{ color:rgba(255,255,255,0.55); }
@media (max-height:620px){
  html.embed .gate-logo{ width:56px; height:56px; margin-bottom:12px; }
  html.embed .gate h1{ font-size:20px; }
  html.embed .gate p{ margin-bottom:16px; }
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important }
  .an{ opacity:1; transform:none } .confetti,.motes{ display:none }
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-in">
    <img class="gate-logo" id="gateLogo" alt="" hidden />
    <h1 id="gateTitle">Your year on<br /><span class="sv" id="gateServer">this server</span></h1>
    <p>Type your Minecraft username to see it.</p>
    <form id="gateForm" autocomplete="off">
      <input id="gateInput" type="text" placeholder="Username…" spellcheck="false" aria-label="Minecraft username" />
      <button type="submit">See my Wrapped</button>
    </form>
    <div class="msg" id="gateMsg" role="status" aria-live="polite"></div>
    <div class="sugg" id="gateSugg"></div>
    <div class="alt-wrap" id="serverWrap" hidden>
      <div class="or">or</div>
      <button class="gate-alt" id="serverBtn" type="button">
        <span>See the whole server's year</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <a class="gate-dc" href="https://discord.gg/hPRGgWKpTF" target="_blank" rel="noopener">
      <span class="i-discord"></span>Name not found? Ask in our Discord</a>
    <div class="foot">Bedrock players: your name may start with a dot.<br />
      <a href="/" id="homeLink">wrapped.gg</a></div>
  </div>
</div>

<div class="story" id="story" aria-hidden="true">
  <div class="stage" id="stage">
    <div class="bars" id="bars"></div>
    <div class="count" id="count"></div>
    <div class="top">
      <button class="home" id="home" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        <span>Home</span>
      </button>
      <button class="x" id="close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <button class="zone l" id="zl" type="button" aria-label="Previous"></button>
    <button class="zone r" id="zr" type="button" aria-label="Next"></button>
    <div class="cards" id="cards"></div>
    <div class="sign">made with <span class="h">&hearts;</span> on wrapped.gg</div>
    <div class="load" id="load"><i></i></div>

    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-in">
        <div class="holder" id="holder"></div>
        <div class="swatches" id="swatches" role="group" aria-label="Card colour"></div>
        <div class="macts">
          <button class="b solid" id="mCopy" type="button">Copy image</button>
          <button class="b" id="mDown" type="button">Download</button>
          <button class="b" id="mBack" type="button">Back</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/wrapped.js" type="module"></script>
</body>
</html>
